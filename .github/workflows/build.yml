name: Build FF External

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with MSVC
      shell: cmd
      run: |
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Auxiliary\Build\vcvars64.bat') do set VCVARS=%%i
        call "%VCVARS%"
        cl /O2 /EHsc FreeFire_External_MSI.cpp /link user32.lib gdi32.lib psapi.lib /OUT:FreeFire_MSI.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: FreeFire_MSI
        path: FreeFire_MSI.exe
        retention-days: 7
