name: Build FF External

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl /O2 /EHsc FreeFire_External_MSI.cpp /link user32.lib gdi32.lib psapi.lib /OUT:FreeFire_MSI.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: FreeFire_MSI
        path: FreeFire_MSI.exe
        retention-days: 7
